<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web.vendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bem-vindo ao Site</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#produtos">Produtos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Página Inicial</h2>
            <p>Seja bem-vindo à web loja</p>
        </section>

        <section id="produtos">
            <h2>Nossos Produtos</h2>
            <div class="grid-produtos">

                <div class="card-produto">
                    <img src="ima1.jpg" alt="Katana Shogun">
                    <h3>Katana Shogun</h3>
                    <p class="preco">R$ 90</p>
                    <a href="#" class="btn-comprar">Comprar</a>
                </div>

                <div class="card-produto">
                    <img src="ima2.jpg" alt="Túmulo do Lobo">
                    <h3>Túmulo do Lobo</h3>
                    <p class="preco">R$ 100</p>
                    <a href="#" class="btn-comprar">Comprar</a>
                </div>

                <div class="card-produto">
                    <img src="ima3.jpg" alt="Espada Sinal dos Mares">
                    <h3>Sinal dos Mares</h3>
                    <p class="preco">R$ 150</p>
                    <a href="#" class="btn-comprar">Comprar</a>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
